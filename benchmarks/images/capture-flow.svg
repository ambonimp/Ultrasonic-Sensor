<svg font-family="-apple-system-body, ui-sans-serif, -apple-system, system-ui, &quot;Segoe UI&quot;, Helvetica, &quot;Apple Color Emoji&quot;, Arial, sans-serif, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;" font-weight="400" data-d-component="svg" fill="currentColor" style="color:rgb(237, 237, 237)" viewBox="0 0 330 136" width="100%" xmlns="http://www.w3.org/2000/svg"><rect x="8" y="10" width="90" height="50" rx="7" fill="#64748b" fill-opacity=".12" stroke="#94a3b8"/><text x="53" y="30" font-size="11" text-anchor="middle" fill="currentColor" font-weight="600">1. Collect</text><text x="53" y="46" font-size="9" text-anchor="middle" fill="currentColor">1,000 samples</text><path d="M101 35 h17 m-5 -4 l5 4 -5 4" stroke="currentColor" fill="none" stroke-width="1.5"/><rect x="120" y="10" width="90" height="50" rx="7" fill="#64748b" fill-opacity=".12" stroke="#94a3b8"/><text x="165" y="30" font-size="11" text-anchor="middle" fill="currentColor" font-weight="600">2. Store</text><text x="165" y="46" font-size="9" text-anchor="middle" fill="currentColor">Buffer A</text><path d="M213 35 h17 m-5 -4 l5 4 -5 4" stroke="currentColor" fill="none" stroke-width="1.5"/><rect x="232" y="10" width="90" height="50" rx="7" fill="#16a34a" fill-opacity=".12" stroke="#16a34a"/><text x="277" y="30" font-size="11" text-anchor="middle" fill="currentColor" font-weight="600">3. Process</text><text x="277" y="46" font-size="9" text-anchor="middle" fill="currentColor">Correlation</text><path d="M277 65 V82 H53 V65" fill="none" stroke="#0d9ea9" stroke-width="1.5" stroke-dasharray="4 3"/><text x="165" y="97" font-size="10" text-anchor="middle" fill="#0d9ea9">Repeat with the next chunk</text><text x="165" y="122" font-size="10" text-anchor="middle" fill="currentColor">Collection and processing can overlap</text></svg>
